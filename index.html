<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Closers - Clientes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Abas principais */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.7);
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(51, 65, 85, 0.9);
            color: #f1f5f9;
        }

        .tab.active {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }

        .tab.promotor.active {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
        }

        .tab.liner.active {
            background: linear-gradient(135deg, #94a3b8 0%, #475569 100%);
        }

        .tab.closer.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        /* Sub-aba Profissionais */
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .sub-tab {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.7);
            transition: all 0.3s ease;
        }

        .sub-tab.active {
            background: rgba(124, 58, 237, 0.25);
            color: #c4b5fd;
            border: 1px solid rgba(124, 58, 237, 0.4);
        }

        /* Info de ordenação */
        .info-bar {
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #cbd5e1;
            border-left: 4px solid #7c3aed;
        }

        .info-bar strong {
            color: #fff;
        }

        .info-bar a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }

        /* Card do profissional */
        .professional-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s ease;
        }

        .professional-card:hover {
            border-color: rgba(124, 58, 237, 0.3);
        }

        .professional-header {
            padding: 18px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.1) 0%, transparent 100%);
        }

        .professional-header:hover {
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.18) 0%, transparent 100%);
        }

        .professional-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-number {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.2);
            color: #c4b5fd;
            font-weight: 700;
            font-size: 14px;
        }

        .professional-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .professional-count {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .toggle-icon {
            font-size: 20px;
            color: #94a3b8;
            transition: transform 0.3s ease;
        }

        .professional-card.open .toggle-icon {
            transform: rotate(180deg);
        }

        /* Conteúdo expansível */
        .professional-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .professional-card.open .professional-body {
            max-height: 2000px;
        }

        .section-title {
            padding: 16px 24px 8px;
            font-size: 14px;
            font-weight: 700;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title.not-buy {
            color: #f87171;
        }

        .badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge.not-buy {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        /* Tabela */
        .table-wrapper {
            padding: 0 24px 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            text-align: left;
            padding: 12px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        thead th:hover {
            color: #fff;
        }

        tbody tr {
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        tbody td {
            padding: 14px 12px;
            color: #cbd5e1;
            vertical-align: middle;
        }

        .client-name {
            font-weight: 700;
            color: #fff;
        }

        .vgv {
            font-weight: 700;
            color: #fbbf24;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status.ativo {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .status.cancelado {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .professional-header {
                padding: 14px 16px;
            }

            .table-wrapper {
                padding: 0 16px 16px;
            }

            tbody td {
                padding: 10px 8px;
                font-size: 13px;
            }
        }

        /* Animação de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .professional-card {
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Abas principais -->
        <div class="tabs">
            <button class="tab promotor" onclick="switchMainTab('promotor')">
                🎯 Ranking Promotor
            </button>
            <button class="tab liner" onclick="switchMainTab('liner')">
                💬 Ranking Liner
            </button>
            <button class="tab closer active" onclick="switchMainTab('closer')">
                🤝 Ranking Closer
            </button>
        </div>

        <!-- Sub-aba -->
        <div class="sub-tabs">
            <button class="sub-tab active">👥 Profissionais</button>
        </div>

        <!-- Info -->
        <div class="info-bar">
            Ranking por <strong>Closer</strong>. Clique nos cabeçalhos para ordenar. 
            <a href="#">Clique no nome do profissional</a> para ver os clientes.
        </div>

        <!-- Lista de profissionais -->
        <div id="professionals-list"></div>
    </div>

    <script>
        // ============================================================
        // DADOS DE EXEMPLO - Substitua pelos seus dados reais
        // ============================================================
        const professionals = [
            {
                id: 1,
                name: "LUIS ALVES DO AMARAL NETO",
                totalClients: 579,
                bought: [
                    { client: "MARIA APARECIDA SANTOS", date: "08/12/2025", quotas: 4, vgv: 320000.00, statuses: ["CANCELADO", "CANCELADO", "CANCELADO", "CANCELADO"] },
                    { client: "JOÃO CARLOS PEREIRA", date: "15/12/2025", quotas: 2, vgv: 160000.00, statuses: ["CANCELADO", "CANCELADO"] },
                    { client: "ANA PAULA FERREIRA", date: "16/12/2025", quotas: 1, vgv: 80000.00, statuses: ["CANCELADO"] },
                    { client: "ROBERTO SILVA OLIVEIRA", date: "18/12/2025", quotas: 1, vgv: 80000.00, statuses: ["ATIVO"] },
                    { client: "FERNANDA LIMA COSTA", date: "22/12/2025", quotas: 1, vgv: 80000.00, statuses: ["CANCELADO"] },
                    { client: "CARLOS EDUARDO MENEZES", date: "23/12/2025", quotas: 2, vgv: 180000.00, statuses: ["CANCELADO", "CANCELADO"] },
                    { client: "PATRÍCIA ANDRADE SOUZA", date: "26/12/2025", quotas: 1, vgv: 118000.00, statuses: ["CANCELADO"] }
                ],
                notBought: [
                    { client: "LUCAS MARTINS RIBEIRO", date: "10/12/2025", reason: "Não atendeu" },
                    { client: "BRUNA ALMEIDA DIAS", date: "12/12/2025", reason: "Desistiu" },
                    { client: "GABRIEL HENRIQUE TORRES", date: "14/12/2025", reason: "Sem interesse" }
                ]
            },
            {
                id: 2,
                name: "FERNANDA SOUZA LIMA",
                totalClients: 342,
                bought: [
                    { client: "RICARDO GOMES SANTANA", date: "05/12/2025", quotas: 3, vgv: 240000.00, statuses: ["ATIVO", "ATIVO", "ATIVO"] },
                    { client: "JULIANA MENDES ROCHA", date: "11/12/2025", quotas: 1, vgv: 95000.00, statuses: ["ATIVO"] },
                    { client: "MARCOS ANTÔNIO VELOSO", date: "19/12/2025", quotas: 2, vgv: 150000.00, statuses: ["CANCELADO", "ATIVO"] }
                ],
                notBought: [
                    { client: "TATIANE BARROS NEVES", date: "08/12/2025", reason: "Preço alto" },
                    { client: "DIEGO FONSECA", date: "20/12/2025", reason: "Não retornou" }
                ]
            },
            {
                id: 3,
                name: "CARLOS HENRIQUE BATISTA",
                totalClients: 215,
                bought: [
                    { client: "SIMONE CRISTINA LOPES", date: "02/12/2025", quotas: 1, vgv: 70000.00, statuses: ["ATIVO"] },
                    { client: "EDUARDO PIRES MACHADO", date: "09/12/2025", quotas: 2, vgv: 140000.00, statuses: ["CANCELADO", "CANCELADO"] }
                ],
                notBought: [
                    { client: "AMANDA ROCHA VIEIRA", date: "04/12/2025", reason: "Sem interesse" },
                    { client: "PEDRO HENRIQUE AMORIM", date: "07/12/2025", reason: "Não atendeu" },
                    { client: "LARISSA CRISTINA DUARTE", date: "13/12/2025", reason: "Desistiu" },
                    { client: "RAFAEL MOURA CAMPOS", date: "17/12/2025", reason: "Preço alto" }
                ]
            }
        ];

        // ============================================================
        // UTILITÁRIOS
        // ============================================================
        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2
            });
        };

        const formatStatus = (statuses) => {
            const uniqueStatuses = [...new Set(statuses)];
            return uniqueStatuses.map(status => {
                const lower = status.toLowerCase();
                const cssClass = lower === 'ativo' ? 'ativo' : 'cancelado';
                const dot = lower === 'ativo' ? '🟢' : '🔴';
                const count = statuses.filter(s => s === status).length;
                const label = count > 1 ? `${status} #${count}` : status;
                return `<span class="status ${cssClass}">${dot} ${label}</span>`;
            }).join(' ');
        };

        // ============================================================
        // RENDERIZAÇÃO
        // ============================================================
        function renderProfessionals() {
            const container = document.getElementById('professionals-list');
            container.innerHTML = '';

            professionals.forEach((prof, index) => {
                const card = document.createElement('div');
                card.className = 'professional-card';
                card.id = `prof-${prof.id}`;

                const boughtRows = prof.bought.map((item, i) => `
                    <tr>
                        <td><span class="client-name">${item.client}</span></td>
                        <td>${item.date}</td>
                        <td>${item.quotas}</td>
                        <td class="vgv">${formatCurrency(item.vgv)}</td>
                        <td>${formatStatus(item.statuses)}</td>
                    </tr>
                `).join('');

                const notBoughtRows = prof.notBought.map(item => `
                    <tr>
                        <td><span class="client-name">${item.client}</span></td>
                        <td>${item.date}</td>
                        <td colspan="3" style="color: #94a3b8;">${item.reason}</td>
                    </tr>
                `).join('');

                card.innerHTML = `
                    <div class="professional-header" onclick="toggleCard(${prof.id})">
                        <div class="professional-info">
                            <div class="rank-number">${index + 1}</div>
                            <div>
                                <div class="professional-name">${prof.name} — ${prof.totalClients} cliente(s) no período</div>
                            </div>
                        </div>
                        <div class="toggle-icon">▼</div>
                    </div>
                    <div class="professional-body">
                        <div class="section-title">
                            ✅ Compraram <span class="badge">${prof.bought.length}</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>CLIENTE</th>
                                        <th>DATA</th>
                                        <th>COTAS</th>
                                        <th>VGV</th>
                                        <th>STATUS CONTRATO</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${boughtRows}
                                </tbody>
                            </table>
                        </div>

                        <div class="section-title not-buy">
                            ❌ Não compraram <span class="badge not-buy">${prof.notBought.length}</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>CLIENTE</th>
                                        <th>DATA</th>
                                        <th colspan="3">MOTIVO</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${notBoughtRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // ============================================================
        // INTERAÇÕES
        // ============================================================
        function toggleCard(id) {
            const card = document.getElementById(`prof-${id}`);
            const isOpen = card.classList.contains('open');

            // Fecha todos os cards
            document.querySelectorAll('.professional-card').forEach(c => c.classList.remove('open'));

            // Abre o clicado se não estiver aberto
            if (!isOpen) {
                card.classList.add('open');
            }
        }

        function switchMainTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab.${tab}`).classList.add('active');

            // Aqui você pode carregar dados diferentes para Promotor/Liner/Closer
            // Por enquanto, mantemos os mesmos dados de exemplo
        }

        // Inicializa
        renderProfessionals();
    </script>
</body>
</html>
